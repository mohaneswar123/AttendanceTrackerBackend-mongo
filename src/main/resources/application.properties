spring.application.name=AttendanceRegister

# === Server Config ===
# Hosts such as Render pass the port in PORT; 8080 locally.
server.port=${PORT:8080}

# === Login tokens (JWT) ===
# HS256 signing key, at least 32 characters. Set JWT_SECRET in production: if it is
# missing, a random key is generated at startup and every restart logs everyone out.
app.jwt.secret=${JWT_SECRET:}
app.jwt.user-token-hours=720
app.jwt.admin-token-hours=12

# === Pomodoro ===
# Length of a focus session and of the break after it
app.pomodoro.focus-seconds=1500
app.pomodoro.break-seconds=300

# === Calendar ===
# Time zone for calendar dates and times (an IANA id such as Asia/Kolkata)
app.calendar.time-zone=${CALENDAR_TIME_ZONE:Asia/Kolkata}

# === CORS ===
# Comma-separated list of frontend origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://attendanceinhand.netlify.app,http://localhost:5173}
